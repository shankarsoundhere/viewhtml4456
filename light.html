<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>लाइट मिस्त्री</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f8f9fa;
}

.header{
    background:#0d6efd;
    color:white;
    text-align:center;
    padding:16px;
    font-size:18px;
    position:sticky;
    top:0;
    z-index:1000;
}

.container{
    padding:12px;
}

.card{
    display:none;
    text-decoration:none;
    color:#212529;
    background:white;
    margin-bottom:12px;
    padding:16px;
    border-radius:12px;
    box-shadow:0 3px 8px rgba(0,0,0,0.08);
    font-size:16px;
    font-weight:500;
    transition:0.2s;
}

.card:active{
    transform:scale(0.98);
    background:#f1f3f6;
}

.back{
    display:block;
    text-align:center;
    margin:15px;
    font-size:16px;
    text-decoration:none;
    color:#0d6efd;
}

@media(max-width:600px){

    .card{
        font-size:17px;
        padding:18px;
    }

}

</style>

</head>

<body>

<div class="header">
💡 लाइट मिस्त्री
</div>

<div class="container" id="lightList">

<a class="card"
href="light-view.html?slot=1"
data-slot="1">राकेश मिस्त्री</a>

<a class="card"
href="light-view.html?slot=2"
data-slot="2">नुनु</a>

<a class="card"
href="light-view.html?slot=3"
data-slot="3">लक्की</a>

<a class="card"
href="light-view.html?slot=4"
data-slot="4">गुल्ला</a>

<a class="card"
href="light-view.html?slot=5"
data-slot="5">बब्लू ड्राइवर</a>

<a class="card"
href="light-view.html?slot=6"
data-slot="6">गोपी मिस्त्री</a>

<a class="card"
href="light-view.html?slot=7"
data-slot="7">सूरज जी</a>

<a class="card"
href="light-view.html?slot=8"
data-slot="8">बैला</a>

<a class="card"
href="light-view.html?slot=9"
data-slot="9">Slot 9</a>

<a class="card"
href="light-view.html?slot=10"
data-slot="10">Slot 10</a>

</div>

<a class="back" href="index.html">
⬅ वापस जाए
</a>

<script type="module">

import {
    db,
    collection,
    onSnapshot
} from "./firebase.js";


const defaultNames = {

    1:"राकेश मिस्त्री",
    2:"नुनु",
    3:"लक्की",
    4:"गुल्ला",
    5:"बब्लू ड्राइवर",
    6:"गोपी मिस्त्री",
    7:"सूरज जी",
    8:"बैला",
    9:"Slot 9",
    10:"Slot 10"

};


const cards =
document.querySelectorAll(".card");


onSnapshot(

    collection(db,"light_names"),

    (snapshot)=>{

        const names = {
            ...defaultNames
        };


        snapshot.forEach(item=>{

            const slot =
            Number(item.id);

            if(slot < 1 || slot > 10)
                return;


            const data =
            item.data();


            if(
                data.name &&
                data.name.trim() !== ""
            ){

                names[slot] =
                data.name.trim();

            }

        });


        cards.forEach(card=>{

            const slot =
            Number(card.dataset.slot);


            card.textContent =
            names[slot];


            card.href =
            "light-view.html?slot=" + slot;


            card.style.display =
            "block";

        });

    },


    (error)=>{

        console.error(
            "Firebase Name Error:",
            error
        );

    }

);

</script>

</body>

</html>

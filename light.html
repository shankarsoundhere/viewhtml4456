<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>लाइट मिस्त्री</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f8f9fa;
}

.header{
    background:#0d6efd;
    color:white;
    text-align:center;
    padding:16px;
    font-size:18px;
    position:sticky;
    top:0;
    z-index:1000;
}

.container{
    padding:12px;
}

.card{
    display:none;
    text-decoration:none;
    color:#212529;
    background:white;
    margin-bottom:12px;
    padding:16px;
    border-radius:12px;
    box-shadow:0 3px 8px rgba(0,0,0,0.08);
    font-size:16px;
    font-weight:500;
    transition:0.2s;
}

.card:active{
    transform:scale(0.98);
    background:#f1f3f6;
}

.back{
    display:block;
    text-align:center;
    margin:15px;
    font-size:16px;
    text-decoration:none;
    color:#0d6efd;
}

@media(max-width:600px){

    .card{
        font-size:17px;
        padding:18px;
    }

}

</style>

</head>

<body>

<div class="header">
💡 लाइट मिस्त्री
</div>

<div class="container" id="lightList"></div>

<a class="back" href="index.html">
⬅ वापस जाए
</a>

<script type="module">

import {
    db,
    collection,
    onSnapshot
} from "./firebase.js";


const lightList =
document.getElementById("lightList");


onSnapshot(

    collection(db,"light_names"),

    (snapshot)=>{

        const names = {};

        snapshot.forEach(item=>{

            const slot =
            Number(item.id);

            // केवल valid positive slot
            if(
                !Number.isInteger(slot) ||
                slot < 1
            ){
                return;
            }

            const data =
            item.data();

            if(
                data.name &&
                data.name.trim() !== ""
            ){

                names[slot] =
                data.name.trim();

            }

        });


        // पुराने cards हटाएं
        lightList.innerHTML = "";


        // Slot को 1,2,3,4... क्रम में लगाएं
        const slots =
        Object.keys(names)
        .map(Number)
        .sort((a,b)=>a-b);


        slots.forEach(slot=>{

            const card =
            document.createElement("a");

            card.className = "card";

            card.href =
            "light-view.html?slot=" + slot;

            card.textContent =
            names[slot];

            card.style.display =
            "block";

            lightList.appendChild(card);

        });

    },

    (error)=>{

        console.error(
            "Firebase Name Error:",
            error
        );

    }

);

</script>

</body>

</html>

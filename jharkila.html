<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>झारकिला लेबर</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#28a745">

<style>
*{box-sizing:border-box}
body{
font-family:Arial,sans-serif;
background:#dcdde1;
margin:0;
padding:15px;
display:flex;
justify-content:center;
align-items:flex-start;
overflow-x:hidden;
}
.page{
width:210mm;
max-width:100%;
min-height:297mm;
background:white;
padding:12mm;
box-shadow:0 0 10px #0003;
}
h3{text-align:center;margin-bottom:10px}
h4{margin-bottom:8px}
table{
border-collapse:collapse;
width:100%;
table-layout:fixed;
font-size:13px;
}
td,th{
border:1px solid black;
padding:6px 3px;
text-align:center;
word-break:break-word;
}
.head td,.head th{font-weight:bold;background:#eee}
#mainTable td:first-child{
width:85px;
white-space:nowrap;
font-size:12px;
}
.noteBox{
border:1px solid black;
padding:8px;
min-height:40px;
margin-top:10px;
}
ul{margin:0;padding-left:18px;text-align:left}
.workerList{
display:grid;
grid-template-columns:repeat(2,minmax(0,1fr));
gap:8px;
margin-top:10px;
}
.workerBtn{
border:1px solid #28a745;
background:#f4fff6;
color:#176b2d;
padding:11px 8px;
border-radius:6px;
font-size:14px;
font-weight:bold;
text-align:left;
cursor:pointer;
}
.workerBtn:active{background:#d9f5df}
.back{text-align:center;margin-top:15px}
.back a{color:#176b2d}
.modal{
display:none;
position:fixed;
inset:0;
background:#0009;
z-index:10;
padding:12px;
overflow-y:auto;
}
.modalBox{
background:white;
max-width:500px;
width:100%;
margin:25px auto;
padding:15px;
border-radius:8px;
}
.close{
float:right;
border:0;
background:#dc3545;
color:white;
padding:7px 12px;
border-radius:5px;
}
.summary{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
margin:15px 0;
}
.summary div{
background:#f1f3f5;
padding:10px;
border-radius:5px;
text-align:center;
}
.summary strong{
display:block;
font-size:18px;
margin-top:5px;
}
.accountTable{font-size:12px;margin-top:10px}
.accountTable th{background:#eee}
.green{color:green}
.red{color:#dc3545}
.empty{text-align:center;color:#777;padding:12px}
@media(max-width:800px){
body{display:block;padding:8px}
.page{
width:100%;
min-height:auto;
padding:10px;
box-shadow:none;
}
table{font-size:11px}
td,th{padding:5px 2px}
.workerList{grid-template-columns:1fr 1fr}
}
@media print{
@page{size:A4;margin:8mm}
body{background:white;padding:0;display:block}
.page{width:100%;min-height:auto;padding:0;box-shadow:none}
.back,.modal{display:none!important}
}
</style>
</head>

<body>
<div class="page">

<h3>👷 झारकिला लेबर</h3>

<table id="mainTable">
<tr class="head">
<td>तारीख</td><td>1</td><td>2</td><td>3</td>
<td>4</td><td>5</td><td>6</td>
</tr>
</table>

<h4>Note</h4>
<div class="noteBox">
<ul id="noteList"></ul>
</div>

<h4>👷 लेबर लिस्ट / खाता</h4>
<div id="workerList" class="workerList">
<div class="empty">लेबर लोड हो रहे हैं...</div>
</div>

<div class="back">
<a href="index.html">⬅ वापस जाए</a>
</div>

</div>

<!-- WORKER ACCOUNT MODAL -->
<div class="modal" id="accountModal">
<div class="modalBox">
<button class="close" onclick="closeAccount()">बंद करें ✕</button>
<h3 id="accountName">लेबर खाता</h3>

<div class="summary">
<div>कुल काम के दिन<strong id="totalDays">0</strong></div>
<div>कुल मजदूरी<strong id="totalWage">₹0</strong></div>
<div>कुल भुगतान<strong id="totalPaid" class="green">₹0</strong></div>
<div>बाकी रकम<strong id="balance" class="red">₹0</strong></div>
</div>

<h4>📒 भुगतान / एडवांस हिसाब</h4>
<table class="accountTable">
<thead>
<tr>
<th>तारीख</th>
<th>विवरण</th>
<th>रकम</th>
</tr>
</thead>
<tbody id="paymentList"></tbody>
</table>
<div id="paymentEmpty" class="empty" style="display:none">
अभी कोई भुगतान या एडवांस नहीं है।
</div>
</div>
</div>

<script type="module">
import {db} from "./firebase.js";
import {collection,onSnapshot}
from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const DAILY_RATE=350;

let attendance=[];
let workers=[];
let payments=[];
let selectedWorker=null;

function safe(value){
return String(value ?? "").replace(/[&<>"']/g,c=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
}[c]));
}

function sortDate(d){
let p=String(d||"").split("-");
if(p.length!==3)return 0;
let dd=p[0].padStart(2,"0");
let mm=p[1].padStart(2,"0");
let yy=p[2];
if(yy.length===2)yy="20"+yy;
return Number(yy+mm+dd);
}

function money(n){
return "₹"+Number(n||0).toLocaleString("en-IN");
}

/* DAILY ATTENDANCE */
onSnapshot(collection(db,"jharkila"),snap=>{
attendance=[];
snap.forEach(d=>{
let x=d.data();
attendance.push({
date:x.date||"",
n1:x.n1||"",
n2:x.n2||"",
n3:x.n3||"",
n4:x.n4||"",
n5:x.n5||"",
n6:x.n6||""
});
});
attendance.sort((a,b)=>sortDate(a.date)-sortDate(b.date));
renderMainTable();
renderWorkers();
if(selectedWorker)showAccount(selectedWorker.id);
});

/* NOTES */
onSnapshot(collection(db,"jharkila_note"),snap=>{
let html="";
snap.forEach(d=>{
let n=d.data();
if(n.text)html+=`<li>${safe(n.text)}</li>`;
});
document.getElementById("noteList").innerHTML=html;
});

/* WORKER MASTER LIST */
onSnapshot(collection(db,"jharkila_workers"),snap=>{
workers=[];
snap.forEach(d=>{
let x=d.data();
workers.push({
id:d.id,
name:x.name||"",
aliases:Array.isArray(x.aliases)?x.aliases:[],
active:x.active!==false
});
});
workers.sort((a,b)=>a.name.localeCompare(b.name,"hi"));
renderWorkers();
if(selectedWorker)showAccount(selectedWorker.id);
});

/* ADVANCE AND PAYMENT RECORDS */
onSnapshot(collection(db,"jharkila_payments"),snap=>{
payments=[];
snap.forEach(d=>{
let x=d.data();
payments.push({
id:d.id,
workerId:x.workerId||"",
workerName:x.workerName||"",
date:x.date||"",
type:x.type||"Payment",
amount:Number(x.amount)||0,
note:x.note||"",
time:x.time||0
});
});
payments.sort((a,b)=>{
let diff=sortDate(a.date)-sortDate(b.date);
return diff||Number(a.time)-Number(b.time);
});
if(selectedWorker)showAccount(selectedWorker.id);
});

/* MAIN TABLE */
function renderMainTable(){
let html=`
<tr class="head">
<td>तारीख</td><td>1</td><td>2</td><td>3</td>
<td>4</td><td>5</td><td>6</td>
</tr>`;

attendance.forEach(x=>{
html+=`
<tr>
<td>${safe(x.date)}</td>
<td>${safe(x.n1)}</td>
<td>${safe(x.n2)}</td>
<td>${safe(x.n3)}</td>
<td>${safe(x.n4)}</td>
<td>${safe(x.n5)}</td>
<td>${safe(x.n6)}</td>
</tr>`;
});
document.getElementById("mainTable").innerHTML=html;
}

/* WORKER LIST */
function renderWorkers(){
let active=workers.filter(w=>w.active);
let html="";

active.forEach(w=>{
html+=`
<button class="workerBtn" onclick="openAccount('${safe(w.id)}')">
👤 ${safe(w.name)}
</button>`;
});

document.getElementById("workerList").innerHTML=
html||'<div class="empty">अभी कोई लेबर नहीं जोड़ा गया है।</div>';
}

/* MATCH WORKER NAME */
function matchesWorker(row,w){
let names=[w.name,...w.aliases]
.filter(Boolean)
.map(n=>String(n).trim().toLowerCase());

return ["n1","n2","n3","n4","n5","n6"].some(key=>{
let value=String(row[key]||"").trim().toLowerCase();
return value && names.includes(value);
});
}

/* OPEN ACCOUNT */
window.openAccount=function(id){
selectedWorker=workers.find(w=>w.id===id);
if(!selectedWorker)return;
document.getElementById("accountModal").style.display="block";
showAccount(id);
};

window.closeAccount=function(){
document.getElementById("accountModal").style.display="none";
selectedWorker=null;
};

/* ACCOUNT DETAILS */
function showAccount(id){
let w=workers.find(x=>x.id===id);
if(!w)return;

selectedWorker=w;

let workDates=new Set();

attendance.forEach(row=>{
if(matchesWorker(row,w)){
workDates.add(row.date);
}
});

let days=workDates.size;
let wage=days*DAILY_RATE;

let workerPayments=payments.filter(p=>
p.workerId===w.id
);

let paid=workerPayments.reduce((sum,p)=>sum+p.amount,0);
let balance=wage-paid;

document.getElementById("accountName").textContent="👤 "+w.name;
document.getElementById("totalDays").textContent=days;
document.getElementById("totalWage").textContent=money(wage);
document.getElementById("totalPaid").textContent=money(paid);
document.getElementById("balance").textContent=money(balance);

let html="";
workerPayments.forEach(p=>{
html+=`
<tr>
<td>${safe(p.date)}</td>
<td>
${safe(p.type)}
${p.note?'<br>'+safe(p.note):""}
</td>
<td>${money(p.amount)}</td>
</tr>`;
});

document.getElementById("paymentList").innerHTML=html;
document.getElementById("paymentEmpty").style.display=
workerPayments.length?"none":"block";
}

/* MODAL CLOSE */
document.getElementById("accountModal").addEventListener("click",e=>{
if(e.target.id==="accountModal")closeAccount();
});
</script>

<script src="pwa.js"></script>
</body>
</html>

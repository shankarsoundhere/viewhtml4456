<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>पंडाल मिस्त्री</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f8f9fa;
}

.header{
    background:#0d6efd;
    color:white;
    text-align:center;
    padding:16px;
    font-size:18px;
    position:sticky;
    top:0;
    z-index:1000;
}

.container{
    padding:12px;
}

.card{
    display:block;
    text-decoration:none;
    color:#212529;
    background:white;
    margin-bottom:12px;
    padding:16px;
    border-radius:12px;
    box-shadow:0 3px 8px rgba(0,0,0,0.08);
    font-size:16px;
    font-weight:500;
    transition:0.2s;
}

.card:active{
    transform:scale(0.98);
    background:#f1f3f6;
}

.back{
    display:block;
    text-align:center;
    margin:15px;
    font-size:16px;
    text-decoration:none;
    color:#0d6efd;
}

@media(max-width:600px){

    .card{
        font-size:17px;
        padding:18px;
    }

}

</style>

</head>

<body>

<div class="header">
पंडाल मिस्त्री
</div>

<div class="container" id="pandalList"></div>

<a class="back" href="index.html">
⬅ वापस जाए
</a>


<script type="module">

import {
    db,
    collection,
    onSnapshot
} from "./firebase.js";


const list =
document.getElementById("pandalList");


/* =========================
   FIREBASE PANDAL NAMES
   जितने भी slot हैं सभी आएंगे
========================= */

onSnapshot(

    collection(db,"pandal_names"),

    (snapshot)=>{

        list.innerHTML = "";


        const names = [];


        snapshot.forEach(item=>{

            const slot =
                Number(item.id);

            const data =
                item.data();


            if(
                !isNaN(slot) &&
                data.name &&
                data.name.trim() !== ""
            ){

                names.push({

                    slot: slot,

                    name:
                        data.name.trim()

                });

            }

        });


        /* =========================
           SLOT NUMBER के अनुसार SORT
        ========================= */

        names.sort(
            (a,b) =>
                a.slot - b.slot
        );


        /* =========================
           CARDS बनाना
        ========================= */

        names.forEach(item=>{

            const card =
                document.createElement("a");


            card.className =
                "card";


            card.href =
                "pandal-view.html?slot=" +
                item.slot;


            card.textContent =
                item.name;


            list.appendChild(card);

        });

    },


    (error)=>{

        console.error(
            "Firebase Pandal Name Error:",
            error
        );

    }

);

</script>

</body>

</html>

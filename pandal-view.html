<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>पंडाल मिस्त्री</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffffff">

<style>
body{
  font-family:Arial,sans-serif;
  margin:10px;
  background:#fff;
  color:#000;
}

h3{
  text-align:center;
  margin:0 0 10px 0;
  font-size:18px;
}

table{
  width:100%;
  border-collapse:collapse;
  table-layout:fixed;
  margin-bottom:15px;
}

/* TABLE HEADER */
th{
  border:1px solid #000;
  padding:6px 10px;
  font-size:14px;
  line-height:1.35;
  vertical-align:middle;
  text-align:center;
  font-weight:bold;
}

/* TABLE DATA */
td{
  border:1px solid #000;
  padding:6px 10px;
  font-size:14px;
  line-height:1.35;
  vertical-align:middle;
  word-break:break-word;
}

th:nth-child(1),
td:nth-child(1){
  width:30%;
  text-align:center;
}

th:nth-child(2),
td:nth-child(2){
  width:27%;
  text-align:left;
}

th:nth-child(3),
td:nth-child(3){
  width:43%;
  text-align:left;
}

.noteBox{
  border:1px solid #000;
  padding:10px 14px;
  margin-top:10px;
  display:none;
}

ul{
  margin:0;
  padding-left:22px;
}

li{
  font-size:14px;
  line-height:1.45;
  margin-bottom:5px;
}

.back{
  display:block;
  text-align:center;
  margin-top:10px;
  text-decoration:none;
  font-size:14px;
}
</style>
</head>

<body>

<h3 id="pageTitle">पंडाल मिस्त्री</h3>

<table id="mainTable">

  <!-- TABLE HEADER -->
  <tr>
    <th>दिनांक</th>
    <th>हाजरी</th>
    <th>जगह</th>
  </tr>

</table>


<div class="noteBox" id="noteBox">
  <ul id="noteList"></ul>
</div>


<a href="pandal.html" class="back">⬅ वापस जाए</a>


<script type="module">

import { db } from "./firebase.js";

import {
  collection,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";


/* =========================
   SLOT प्राप्त करें
========================= */

const params =
  new URLSearchParams(window.location.search);

const slot =
  params.get("slot") || "1";


/* =========================
   FIREBASE से नाम लोड करें
========================= */

const nameRef =
  collection(db, "pandal_names");


onSnapshot(
  nameRef,

  (snapshot) => {

    let currentName = "";


    snapshot.forEach(item => {

      if(item.id === String(slot)){

        const data =
          item.data();


        if(
          data.name &&
          data.name.trim() !== ""
        ){

          currentName =
            data.name.trim();

        }

      }

    });


    if(currentName !== ""){

      document.title =
        currentName;

      document.getElementById(
        "pageTitle"
      ).innerText =
        currentName;

    }else{

      document.title =
        "पंडाल मिस्त्री";

      document.getElementById(
        "pageTitle"
      ).innerText =
        "पंडाल मिस्त्री";

    }

  },

  (error) => {

    console.error(
      "Firebase Name Error:",
      error
    );

  }

);


/* =========================
   SLOT DATA
========================= */

const colRef =
  collection(
    db,
    "pandal_slot_" + slot
  );


onSnapshot(
  colRef,

  (snap) => {

    let rows = [];
    let notes = [];


    snap.forEach(doc => {

      let d =
        doc.data();


      /* =========================
         MAIN TABLE DATA
      ========================= */

      if(
        (d.date && d.date !== "-") ||
        (d.work && d.work.trim() !== "") ||
        (d.place && d.place.trim() !== "")
      ){

        rows.push({

          date:
            d.date || "",

          work:
            d.work || "",

          place:
            d.place || "",

          time:
            d.time || 0

        });

      }


      /* =========================
         NOTES DATA
      ========================= */

      if(
        (d.note || "").trim() !== ""
      ){

        notes.push({

          note:
            d.note,

          time:
            d.time || 0

        });

      }

    });


    /* =========================
       SORT DATA
    ========================= */

    rows.sort(
      (a,b) => a.time - b.time
    );


    notes.sort(
      (a,b) => a.time - b.time
    );


    /* =========================
       TABLE
       HEADER हमेशा रहेगा
    ========================= */

    let mainHTML = `

      <tr>

        <th>दिनांक</th>

        <th>हाजरी</th>

        <th>जगह</th>

      </tr>

    `;


    rows.forEach(d => {

      mainHTML += `

        <tr>

          <td>${d.date}</td>

          <td>${d.work}</td>

          <td>${d.place}</td>

        </tr>

      `;

    });


    document.getElementById(
      "mainTable"
    ).innerHTML =
      mainHTML;


    /* =========================
       NOTES
    ========================= */

    let noteHTML = "";


    notes.forEach(n => {

      noteHTML +=
        `<li>${n.note}</li>`;

    });


    document.getElementById(
      "noteList"
    ).innerHTML =
      noteHTML;


    /* =========================
       NOTE BOX SHOW / HIDE
    ========================= */

    if(noteHTML.trim() !== ""){

      document.getElementById(
        "noteBox"
      ).style.display =
        "block";

    }else{

      document.getElementById(
        "noteBox"
      ).style.display =
        "none";

    }

  },

  (error) => {

    console.error(
      "Firebase Slot Data Error:",
      error
    );

  }

);

</script>


<script src="pwa.js"></script>

</body>
</html>

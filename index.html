<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tent House</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#28a745">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
body{
margin:0;
font-family:Arial;
background:#f1f3f6;
}

/* LED */
.led-board{
width:100%;
overflow:hidden;
white-space:nowrap;
background:black;
padding:12px 0;
cursor:pointer;
user-select:none;
}

.led-text{
display:inline-block;
font-size:22px;
font-weight:bold;
animation:scrollText 12s linear infinite;
}

@keyframes scrollText{
0%{transform:translateX(100%);}
100%{transform:translateX(-100%);}
}

.saffron{color:orange;}
.white{color:white;}
.green{color:#00ff00;}

/* CARD */
.container{
padding:10px;
}

.card{
background:white;
margin-bottom:12px;
padding:14px;
border-radius:10px;
box-shadow:0 2px 6px rgba(0,0,0,0.1);
cursor:pointer;
transition:0.3s;
font-size:18px;
}

.card:hover{
transform:scale(1.03);
}

/* BANK ICON STYLE */
.bank-icon {
position: fixed;
bottom: 20px;
right: 20px;
background: white;
width: 55px;
height: 55px;
border-radius: 50%;
display: flex;
align-items: center;
justify-content: center;
font-size: 28px;
box-shadow: 0 4px 10px rgba(0,0,0,0.2);
cursor: pointer;
user-select: none; /* डबल क्लिक पर टेक्स्ट सेलेक्ट होने से रोकता है */
transition: 0.2s;
}

.bank-icon:active {
transform: scale(0.92);
}

/* DESKTOP */
@media(min-width:700px){
.container{
max-width:500px;
margin:auto;
}
}
</style>
</head>

<body>

<div class="led-board" ondblclick="openOldPage()">
<div class="led-text">
<span class="saffron">शंकर टेंट हाउस</span>
<span class="white">लखीसराय</span>
<span class="green">7004814456 , 6200164687</span>
</div>
</div>

<div class="container">

<div class="card" onclick="location.href='light.html'">
💡 लाइट मिस्त्री
</div>

<div class="card" onclick="location.href='jharkila.html'">
👷 झारकिला लेबर
</div>

<div class="card" onclick="location.href='pandal.html'">
🏕 पंडाल मिस्त्री
</div>

<div class="card" onclick="location.href='old.html'">
📜 डायरी हिसाब
</div>

<div class="card" onclick="location.href='bakaya.html'">
📖 बकाया
</div>

<div class="card" onclick="location.href='sound.html'">
📡 साटा बुकिंग
</div>

</div>

<!-- BANK LOGO (डबल क्लिक करने पर bank.html खुलेगा) -->
<div class="bank-icon" ondblclick="openBankPage()" title="Double click for Bank">
💰
</div>

<script>
// बैंक पेज खोलने का फंक्शन
function openBankPage() {
    location.href = 'bank.html';
}
</script>

<script src="pwa.js"></script>

</body>
</html>
